<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLink - URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>QuickLink</h1>

        <p class="subtitle">
            Shorten your long URLs in seconds
        </p>

        <form id="urlForm">

            <input
                type="url"
                id="longUrl"
                placeholder="Paste your long URL here..."
                required
            >

            <button type="submit">
                Shorten URL
            </button>

        </form>

        <div id="result" class="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
